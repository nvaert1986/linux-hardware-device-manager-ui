# One distribution. Modules are subpackages of hardware_ui.modules rather than separate
# packages -- nothing vendor-owned ships in this tree (Poly extracts locally, Jabra fetches on
# consent), so there is nothing to isolate for licensing, and subsetting on Gentoo is a USE flag
# rather than four ebuilds. Out-of-tree modules remain first-class via the entry point group.

[project]
name = "hardware-ui"
version = "0.10.3"
description = "One uniform interface for configuring USB and Bluetooth hardware on Linux"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PyQt6>=6.7"]

# Per-module, because a user with one Razer mouse should not be made to install a YAML parser.
# Every module degrades to a clear message when its own dependency is absent, and the shell starts
# regardless -- a module's imports happen when one of its devices is opened, never at startup.
[project.optional-dependencies]
logitech = ["pyudev>=0.21", "PyYAML>=5.1"]
hotplug = ["pyudev>=0.21"]
fido = ["fido2>=1.1"]
yubikey = ["fido2>=1.1", "yubikey-manager>=5.0"]

[project.scripts]
hardware-ui = "hardware_ui.shell.__main__:main"
# Headless diagnostics; imports no Qt, which also keeps the core honest.
hardware-ui-cli = "hardware_ui.cli:main"

# In-tree modules register the same way an out-of-tree one would, so there is no privileged path.
[project.entry-points."hardware_ui.modules"]
sony_headsets = "hardware_ui.modules.sony_headsets"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hardware_ui"]

[tool.hatch.build.targets.wheel.force-include]
"hardware_ui/modules/sony/module.toml" = "hardware_ui/modules/sony/module.toml"

[tool.ruff]
line-length = 100
target-version = "py313"

# Ported verbatim from the hardware-verified upstream projects. Kept byte-identical so it can be
# diffed and re-synced against its origin; reformatting it would trade working code for style.
# Adapter layers (device.py, capabilities.py) are ours and stay linted.
extend-exclude = [
    "hardware_ui/modules/*/protocol/",
    "hardware_ui/modules/*/transport/",
    "hardware_ui/modules/*/headphones.py",
    # Not ours at all: Solaar's logitech_receiver, vendored by tools/vendor_solaar.py and kept
    # byte-identical for the same reason -- re-syncing is a re-run, not a merge. Reformatting
    # someone else's GPL code would also make the diff against upstream useless.
    "hardware_ui/third_party/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# QModelIndex() as a default argument is the required Qt signature for rowCount/data/index.
# Qt calls these from C++ with a default-constructed index; there is no alternative spelling.
"**/models.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run straight from the source tree -- no install, no venv, no editable shim.
pythonpath = ["."]
# Solaar's find_paired_node reaches pyudev through `Device.get()`, which pyudev deprecated in
# favour of `Device.properties`. It is vendored third-party code calling another library's
# deprecated API -- not ours to fix and not worth patching, since the patch set exists to be
# re-appliable. Silenced by message so a *different* deprecation still shows up.
filterwarnings = [
    "ignore:Will be removed in 1.0. Access properties with Device.properties:DeprecationWarning",
]
